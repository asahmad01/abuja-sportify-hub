<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Spotts</title>
    <!--
      GitHub Pages has no SPA routing: a direct hit to /gollazo, /events, etc.
      lands here (404) instead of index.html. This script rewrites the path
      into a query string and redirects to the root, where a companion snippet
      in index.html restores it before React Router boots. So deep links and
      shared links resolve correctly. (rafgraph/spa-github-pages technique.)
      pathSegmentsToKeep = 0 because the site is served at the domain root.
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
